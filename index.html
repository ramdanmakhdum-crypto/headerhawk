<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeaderHawk Simpel</title>
    <style>
        body { font-family: sans-serif; background-color: #0d1117; color: white; text-align: center; padding-top: 50px; }
        input { padding: 10px; width: 60%; border-radius: 5px; border: none; }
        button { padding: 10px 20px; background-color: #238636; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; font-weight: bold; }
        #hasil { margin-top: 30px; text-align: left; padding: 20px; background: #161b22; border-radius: 10px; word-wrap: break-word; font-size: 14px; }
        .loading { color: #d29922; }
    </style>
</head>
<body>
    <h1>🦅 HeaderHawk Simpel</h1>
    <p style="font-size: 12px; color: #888;" id="status-server">Menghubungi server...</p>
    <input type="text" id="url" placeholder="Masukkan URL (contoh: https://google.com)">
    <br>
    <button onclick="scan()">Scan Sekarang!</button>
    
    <div id="hasil"></div>

    <script>
        const API_URL = "https://headerhawk-r8zd.onrender.com";
        const statusServer = document.getElementById('status-server');

        // KODE AJAIB: Membangunkan server otomatis saat halaman dibuka
        fetch(API_URL)
            .then(() => { statusServer.innerText = "✅ Server Siap!"; statusServer.style.color = "#3fb950"; })
            .catch(() => { statusServer.innerText = "⚠️ Sedang membangunkan server (tunggu 1 menit)..."; });

        async function scan() {
            const url = document.getElementById('url').value;
            const hasil = document.getElementById('hasil');
            
            if(!url) return alert('Isi URL dulu!');
            
            hasil.innerHTML = "<span class='loading'>Sedang memindai... Mohon tunggu.</span>";

            try {
                const response = await fetch(`${API_URL}/scan?url=${encodeURIComponent(url)}`);
                const data = await response.json();
                
                hasil.innerHTML = `<h3>Hasil:</h3><p>${JSON.stringify(data, null, 2)}</p>`;
            } catch (error) {
                hasil.innerHTML = "<span style='color:red;'>Gagal. Server mungkin butuh waktu lebih lama untuk bangun. Silakan klik Scan lagi.</span>";
            }
        }
    </script>
</body>
</html>
