<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeaderHawk Simpel</title>
    <style>
        body { font-family: sans-serif; background-color: #0d1117; color: white; text-align: center; padding-top: 50px; }
        input { padding: 10px; width: 60%; border-radius: 5px; border: none; }
        button { padding: 10px 20px; background-color: #238636; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        #hasil { margin-top: 30px; text-align: left; padding: 20px; background: #161b22; border-radius: 10px; word-wrap: break-word; font-size: 14px; }
    </style>
</head>
<body>
    <h1>🦅 HeaderHawk Simpel</h1>
    <input type="text" id="url" placeholder="Masukkan URL (contoh: https://google.com)">
    <br>
    <button onclick="scan()">Scan Sekarang!</button>
    
    <div id="hasil"></div>

    <script>
        async function scan() {
            const url = document.getElementById('url').value;
            const hasil = document.getElementById('hasil');
            hasil.innerHTML = "Sedang memindai... Mohon tunggu (maksimal 1 menit untuk bangunkan server).";

            try {
                // Memanggil API Render secara langsung
                const response = await fetch(`https://headerhawk-r8zd.onrender.com/scan?url=${encodeURIComponent(url)}`);
                const data = await response.json();
                
                // Menampilkan data mentah (tanpa format rumit)
                hasil.innerHTML = `<h3>Hasil:</h3><p>${JSON.stringify(data, null, 2)}</p>`;
            } catch (error) {
                hasil.innerHTML = "Server sedang sibuk atau koneksi terputus. Silakan klik Scan lagi.";
            }
        }
    </script>
</body>
</html>
